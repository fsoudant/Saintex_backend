<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte des risques — Saintex</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, sans-serif; }
  #map { height: 100%; }
  .bar { padding: 10px 14px; background: #1f2937; color: white; font-size: 15px; }
  .bar a { color: #93c5fd; margin-left: 12px; }
</style>
</head>
<body>
  <div class="bar">
    🗺️ Carte des risques — couleur = moyenne des risques actifs par zone, transparent = zone saine
    <a href="/admin/risks/endemie/">← retour à l'admin</a>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([15, 20], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    fetch("{% url 'risk_map_geojson' %}")
      .then(r => r.json())
      .then(data => {
        L.geoJSON(data, {
          style: (f) => ({
            fillColor: f.properties.fill || '#ffffff',
            fillOpacity: f.properties.fill ? 0.55 : 0,
            color: f.properties.fill || '#94a3b8',
            weight: f.properties.layer === 'exclusion' ? 2 : 1,
            dashArray: f.properties.layer === 'exclusion' ? '4,3' : null,
          }),
          onEachFeature: (f, layer) => {
            if (f.properties.layer === 'exclusion') {
              layer.bindPopup(
                `<b>${f.properties.nom}</b><br>Zone saine pour : ${f.properties.risque_exclu}`
              );
            } else {
              layer.bindPopup(
                `<b>${f.properties.nom}</b><br>Risques : ${f.properties.risques.join(', ') || 'aucun'}`
              );
            }
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
